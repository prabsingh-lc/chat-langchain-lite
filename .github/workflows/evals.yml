name: Offline Evals

# ─── PLATFORM-OWNED ───────────────────────────────────────────────────────────
# This workflow is the mandatory pre-merge quality gate. It is owned by the
# platform team (see CODEOWNERS) — agent builders consume it, they do not edit
# it. The evaluator suite and the pass threshold are central policy.
# ──────────────────────────────────────────────────────────────────────────────

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

# Supersede in-flight runs when a PR is pushed to again, so the check that
# gates merge always reflects the newest commit.
concurrency:
  group: evals-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evals:
    name: Offline evals (mandatory)
    # Runs on EVERY PR to main by default — that is the gate.
    #
    # Escape hatch: apply the `skip-evals` label to opt a PR out (e.g. a
    # docs-only or trivial Engine code-fix PR where eval gating is noise).
    # A job skipped this way reports as "skipped", which GitHub counts as a
    # PASS for a required status check — so the label is a genuine bypass.
    # Who may apply labels is itself the access-control story.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.pull_request.labels.*.name, 'skip-evals')
    runs-on: ubuntu-latest
    env:
      # Model routing. The agent code uses a plain constructor and reads these
      # from the environment, so the same code runs locally (shell vars) and
      # here (Actions secrets) with no branching.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      LANGSMITH_PROJECT: ${{ secrets.LANGSMITH_PROJECT }}
      LANGSMITH_WORKSPACE_ID: ${{ secrets.LANGSMITH_WORKSPACE_ID }}
      DEMO_PRESENTER: ${{ vars.DEMO_PRESENTER }}
      LANGSMITH_TRACING: "true"
    steps:
      # On a PR, evaluate the PR head. On a manual dispatch, evaluate whatever
      # branch was dispatched.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      # Runs the agent on the shared dataset and scores it with the offline
      # evaluators. --skip-dataset fetches the dataset from LangSmith by name,
      # so examples Engine adds are picked up automatically.
      #
      # --threshold is the merge gate: below it, this step exits 1, the check
      # goes red, and branch protection blocks the merge button.
      - name: Run offline evals
        run: |
          uv run python -m scripts.run_evals \
            --skip-dataset \
            --threshold 0.7 \
            --experiment-prefix "ci-${LANGSMITH_PROJECT}-pr${{ github.event.pull_request.number || 'manual' }}"
